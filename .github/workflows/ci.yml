name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: debug-${{ runner.os }}

      - name: Conan install + build (clang-debug)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-debug
          conan-build-type: Debug

      - name: Test (clang-debug)
        run: ./scripts/test.sh clang-debug

      - name: Format check
        run: ./scripts/lint.sh format-check

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: asan-${{ runner.os }}

      - name: Conan install + build (clang-asan)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-asan
          conan-build-type: Debug
          # --build=gtest* 强制 GTest 与项目同工具链从源码构建，避免预编译包
          # 混链在 gtest 静态注册阶段触发 libc++ 容器注解误报
          # （见 docs/postmortems/2026-07-13-*）
          extra-conan-args: --build=gtest*

      - name: Test (clang-asan)
        env:
          # 1) LeakSanitizer 在进程退出时需要 ptrace，部分受限环境不可用；泄漏检测
          #    保留为发布机检查项（postmortem 2026-07-13）。
          # 2) alloc_dealloc_mismatch 关闭：异常对象在项目代码（ASan 插桩）中经
          #    operator new 分配，由未插桩的系统 libc++18 用 free 释放，触发
          #    系统性误报（本地 libc++19 不触发）；其余 ASan/UBSan 检查保持启用。
          ASAN_OPTIONS: detect_leaks=0:alloc_dealloc_mismatch=0
        run: ./scripts/test.sh clang-asan

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: coverage-${{ runner.os }}

      - name: Install llvm-cov tooling
        run: sudo apt-get install -y -qq llvm-18

      - name: Conan install + build (clang-coverage)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-coverage
          conan-build-type: Debug

      - name: Run tests with profile capture
        env:
          # 每个测试进程写独立的 .profraw（%p = pid）；ctest 子进程继承该环境变量
          LLVM_PROFILE_FILE: /tmp/prof/%p.profraw
        run: |
          mkdir -p /tmp/prof
          ./scripts/test.sh clang-coverage

      - name: Generate coverage report (lcov)
        run: |
          set -euo pipefail
          if ! compgen -G "/tmp/prof/*.profraw" > /dev/null; then
            echo "no profraw produced" >&2
            exit 1
          fi
          llvm-profdata-18 merge -sparse /tmp/prof/*.profraw -o coverage.profdata
          # 只统计 src/include 下的生产代码；排除构建产物与测试自身源码
          objects=(build/clang-coverage/src/fqc)
          while IFS= read -r t; do objects+=("$t"); done \
            < <(find build/clang-coverage/tests -type f -perm -u+x \
                  -not -name '*.a' -not -name '*.o' -not -name '*.ninja' | sort)
          llvm-cov-18 export -format=lcov -instr-profile=coverage.profdata \
            -ignore-filename-regex='(^|[\\/])(build|\.conan2|tests)[\\/]' \
            "${objects[@]/#/-object=}" > coverage.info
          wc -l coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          # token 未配置时（新仓库/未授权）不阻断 CI，报告仅存 artifact
          fail_ci_if_error: false

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: tidy-${{ runner.os }}

      - name: Install clang-tidy
        run: sudo apt-get install -y -qq clang-tidy-18

      # 构建 clang-debug 仅为获得 compile_commands.json（无需测试）
      - name: Conan install + build (clang-debug)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-debug
          conan-build-type: Debug

      - name: Run clang-tidy on production sources
        run: |
          set -euo pipefail
          # 只对 src/ 下的生产源做静态分析（tests 排除，HeaderFilterRegex
          # 已限定 src|include）。.clang-tidy 设 WarningsAsErrors='*'，
          # 任一告警即失败（门禁语义）。
          failed=0
          while IFS= read -r f; do
            if ! clang-tidy-18 -p build/clang-debug "$f" 2>&1; then
              failed=1
            fi
          done < <(find src -name '*.cpp' | sort)
          exit $failed
