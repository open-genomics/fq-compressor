name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: debug-${{ runner.os }}

      - name: Conan install + build (clang-debug)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-debug
          conan-build-type: Debug

      - name: Test (clang-debug)
        run: ./scripts/test.sh clang-debug

      - name: Format check
        run: ./scripts/lint.sh format-check

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: asan-${{ runner.os }}

      - name: Conan install + build (clang-asan)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-asan
          conan-build-type: Debug
          # --build=gtest* 强制 GTest 与项目同工具链从源码构建，避免预编译包
          # 混链在 gtest 静态注册阶段触发 libc++ 容器注解误报
          # （见 docs/postmortems/2026-07-13-*）
          extra-conan-args: --build=gtest*

      - name: Test (clang-asan)
        env:
          # 1) LeakSanitizer 在进程退出时需要 ptrace，部分受限环境不可用；泄漏检测
          #    保留为发布机检查项（postmortem 2026-07-13）。
          # 2) alloc_dealloc_mismatch 关闭：异常对象在项目代码（ASan 插桩）中经
          #    operator new 分配，由未插桩的系统 libc++18 用 free 释放，触发
          #    系统性误报（本地 libc++19 不触发）；其余 ASan/UBSan 检查保持启用。
          ASAN_OPTIONS: detect_leaks=0:alloc_dealloc_mismatch=0
        run: ./scripts/test.sh clang-asan

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: tsan-${{ runner.os }}

      - name: Conan install + build (clang-tsan)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-tsan
          conan-build-type: Debug
          # 与 ASan job 同理：GTest 与项目同工具链从源码构建，避免混链误报
          extra-conan-args: --build=gtest*

      - name: Test (clang-tsan)
        env:
          # halt_on_error：发现竞争即失败（门禁语义）；second_deadlock_stack
          # 记录死锁对另一侧的调用栈，便于定位。
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          # Ubuntu 24.04 runner 内核默认 ASLR 熵 vm.mmap_rnd_bits=32 会让 TSan
          # 的影子内存映射失败（"unexpected memory mapping"），降回 28 恢复可用。
          sudo sysctl -w vm.mmap_rnd_bits=28
          ./scripts/test.sh clang-tsan

  release-build:
    # 每次提交都编译 Release 配置（IPO/LTO + 可移植开关），否则 Release-only
    # 的编译失败要等到打 tag 才被发现；FQC_PORTABLE=ON 同时保证预发布的
    # 二进制不依赖 runner CPU（-march=native）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-portable-${{ runner.os }}

      - name: Conan install + build (clang-release-portable)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-release-portable
          conan-build-type: Release

      - name: Test (clang-release-portable)
        run: ./scripts/test.sh clang-release-portable

  fuzz:
    # libFuzzer 短跑：解析器与归档读取器是纯输入驱动组件，最适配 fuzzing；
    # 长跑由独立的 fuzz-nightly.yml 承担。种子取冻结 fixture，从格式深处开变。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: fuzz-${{ runner.os }}

      - name: Conan install + build (clang-fuzz)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-fuzz
          conan-build-type: Debug
          # libFuzzer 运行时按 libstdc++ 构建，与 libc++ 不兼容：fuzz 构建整体
          # 走 libstdc++ 工具链（预设继承 base 而非 clang-base）
          conan-libcxx: libstdc++11
          # 与 ASan job 同理：GTest 同工具链源码构建
          extra-conan-args: --build=gtest*

      - name: Fuzz parser and archive reader
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus/fastq /tmp/corpus/archive /tmp/seeds/fastq /tmp/seeds/archive
          cp tests/fixtures/sequential-v2/input_*.fastq /tmp/seeds/fastq/
          cp tests/fixtures/sequential-v2/*.fqc /tmp/seeds/archive/
          ./build/clang-fuzz/tests/fastq_parser_fuzz /tmp/corpus/fastq \
            /tmp/seeds/fastq -max_total_time=90 -print_final_stats=1
          ./build/clang-fuzz/tests/archive_reader_fuzz /tmp/corpus/archive \
            /tmp/seeds/archive -max_total_time=90 -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            oom-*
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: coverage-${{ runner.os }}

      - name: Install llvm-cov tooling
        run: sudo apt-get install -y -qq llvm-18

      - name: Conan install + build (clang-coverage)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-coverage
          conan-build-type: Debug

      - name: Run tests with profile capture
        env:
          # 每个测试进程写独立的 .profraw（%p = pid）；ctest 子进程继承该环境变量
          LLVM_PROFILE_FILE: /tmp/prof/%p.profraw
        run: |
          mkdir -p /tmp/prof
          ./scripts/test.sh clang-coverage

      - name: Generate coverage report (lcov)
        run: |
          set -euo pipefail
          if ! compgen -G "/tmp/prof/*.profraw" > /dev/null; then
            echo "no profraw produced" >&2
            exit 1
          fi
          llvm-profdata-18 merge -sparse /tmp/prof/*.profraw -o coverage.profdata
          # 只统计 src/include 下的生产代码；排除构建产物与测试自身源码
          objects=(build/clang-coverage/src/fqc)
          while IFS= read -r t; do objects+=("$t"); done \
            < <(find build/clang-coverage/tests -type f -perm -u+x \
                  -not -name '*.a' -not -name '*.o' -not -name '*.ninja' | sort)
          llvm-cov-18 export -format=lcov -instr-profile=coverage.profdata \
            -ignore-filename-regex='(^|[\\/])(build|\.conan2|tests)[\\/]' \
            "${objects[@]/#/-object=}" > coverage.info
          wc -l coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          # token 未配置时（新仓库/未授权）不阻断 CI，报告仅存 artifact
          fail_ci_if_error: false

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: tidy-${{ runner.os }}

      - name: Install clang-tidy
        run: sudo apt-get install -y -qq clang-tidy-18

      # 构建 clang-debug 仅为获得 compile_commands.json（无需测试）
      - name: Conan install + build (clang-debug)
        uses: ./.github/actions/conan-build
        with:
          preset: clang-debug
          conan-build-type: Debug

      - name: Run clang-tidy on production sources
        run: |
          set -euo pipefail
          # 只对 src/ 下的生产源做静态分析（tests 排除，HeaderFilterRegex
          # 已限定 src|include）。.clang-tidy 设 WarningsAsErrors='*'，
          # 任一告警即失败（门禁语义）。
          failed=0
          while IFS= read -r f; do
            if ! clang-tidy-18 -p build/clang-debug "$f" 2>&1; then
              failed=1
            fi
          done < <(find src -name '*.cpp' | sort)
          exit $failed

  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # verify-archived 的 append-only 封印对照需要基线 ref
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify agent notes
        env:
          # 对照变更前的 commit：PR 用 base.sha，push 用 event.before；
          # 新分支 push 时 before=0000…，脚本自动降级为哈希自校验
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/notes.sh verify
