name: Release

# 打 v* tag 时构建 release 二进制并附到对应 GitHub Release。
# CHANGELOG 发布段与 tag 由发布者在 commit 时同步维护。

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # 只有发布 job 需要写 Release；构建与 smoke test 继承只读权限。
    permissions:
      contents: write
    env:
      # 构建目录由 preset 推导（CMakePresets.json 的 binaryDir 为
      # build/${presetName}）。产物路径统一引用此变量，避免 preset 与取件
      # 路径再次漂移。
      PRESET: clang-release-portable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@77c3f8fd59034e6f3d5c58867ded0185b48d534f # v1
        with:
          key: release-${{ runner.os }}

      - name: Build release binary
        uses: ./.github/actions/conan-build
        with:
          # FQC_PORTABLE=ON：发布产物禁用 -march=native，保证在旧 CPU 上可用
          # （clang-release-portable 预设；每 PR 的 release-build job 已在同一
          # 配置下跑过编译+测试门禁）
          preset: ${{ env.PRESET }}
          conan-build-type: Release

      # 发布回归 sanity：不做性能断言（CI 吞吐波动 ±20-85%，见
      # docs/roadmap.md 阶段 E），只验证 round-trip 与 verify 功能可用。
      - name: Round-trip and verify sanity
        run: |
          set -euo pipefail
          fqc=build/${{ env.PRESET }}/src/fqc
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          "$fqc" compress -i tests/fixtures/sequential-v2/input_se.fastq -o "$tmp/se.fqc"
          "$fqc" verify "$tmp/se.fqc"
          "$fqc" decompress -i "$tmp/se.fqc" -o "$tmp/se.out.fastq"
          cmp tests/fixtures/sequential-v2/input_se.fastq "$tmp/se.out.fastq"
          "$fqc" --version
          echo "::notice::release smoke test passed"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/${{ env.PRESET }}/src/fqc dist/fqc
          # 发布资产附带本项目许可证与静态链接依赖的许可证声明
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          ldd dist/fqc
          sha256sum dist/fqc > dist/SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
