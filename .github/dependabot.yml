# Dependabot 自动依赖更新
# - conan: 检查 conanfile.py 中的 C++ 依赖
# - github-actions: 检查 GitHub Actions 版本
version: 2
updates:
  - package-ecosystem: "conan"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
